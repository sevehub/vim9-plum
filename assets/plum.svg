<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="plum-title plum-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="plum-title">plum</title>
  <desc id="plum-desc">A chubby, smiling plug with two prongs and a curly cord.</desc>
  <defs>
    <radialGradient id="plum-body" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#d6a8f0"/>
      <stop offset="0.55" stop-color="#a35fd0"/>
      <stop offset="1" stop-color="#64308f"/>
    </radialGradient>
    <linearGradient id="plum-prong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#c3c9d6"/>
    </linearGradient>
  </defs>

  <!-- cord -->
  <path d="M128 208 C128 236 96 226 96 244 C96 256 120 256 136 250" fill="none" stroke="#3b1a5e" stroke-width="12" stroke-linecap="round"/>

  <!-- prongs, drawn first so the body covers their base -->
  <rect x="94" y="20" width="20" height="62" rx="10" fill="url(#plum-prong)"/>
  <rect x="142" y="20" width="20" height="62" rx="10" fill="url(#plum-prong)"/>

  <!-- body -->
  <ellipse cx="128" cy="144" rx="90" ry="78" fill="url(#plum-body)"/>
  <path d="M60 106 C70 76 100 62 128 62" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>

  <!-- face -->
  <ellipse cx="98" cy="136" rx="9" ry="11" fill="#2b1046"/>
  <ellipse cx="158" cy="136" rx="9" ry="11" fill="#2b1046"/>
  <circle cx="101" cy="132" r="3.2" fill="#ffffff"/>
  <circle cx="161" cy="132" r="3.2" fill="#ffffff"/>
  <ellipse cx="78" cy="162" rx="14" ry="9" fill="#ff8fb0" fill-opacity="0.55"/>
  <ellipse cx="178" cy="162" rx="14" ry="9" fill="#ff8fb0" fill-opacity="0.55"/>
  <path d="M106 164 Q128 188 150 164" fill="none" stroke="#2b1046" stroke-width="7" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
